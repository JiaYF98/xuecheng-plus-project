server:
  port: 8085
spring:
  application:
    name: gateway
  cloud:
    consul:
      discovery:
        instance-group: xuecheng-plus-gateway
        service-name: ${spring.application.name}
    gateway:
      routes:
        - id: content-api
          uri: lb://content-api
          predicates:
            - Path=/content/**
        - id: system-api
          uri: lb://system-api
          predicates:
            - Path=/system/**
        - id: media-api
          uri: lb://media-api
          predicates:
            - Path=/media/**
#  webflux:
#    base-path: /gateway
management:
  endpoints:
    web:
      exposure:
        include: health